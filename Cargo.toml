[package]
name = "aboutkonrad-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
chrono = "0.4"
hyper = "1.7.0"

[profile.dev]
incremental = true
